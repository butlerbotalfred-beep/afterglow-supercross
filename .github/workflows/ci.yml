name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, tests, build, pace gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Line length (140 characters in src/)
        run: npm run lint:lines
      - name: Sound levels are always ramped (no clicks)
        run: npm run lint:audio
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build and size budgets
        run: npm run build:report -- --check
      - name: Pace gate (10 AI races must match baselines exactly)
        run: npm run pace-gate -- --tolerance 0
      - name: Landing harness
        run: npm run landing-harness -- --check
      - name: Field check (60 AI races, 4 to 8 riders, every difficulty, no crashes)
        run: npm run field-check -- --check
      - name: Start check (100 seeded 8-rider gate starts per circuit, no crashes before the holeshot line)
        run: npm run start-check -- --check
